import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'net.fabricmc.fabric-loom'              // version managed in settings.gradle via pluginManagement
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' // version managed in settings.gradle via pluginManagement
}

// ==========================================================================================
// Build Number Logic
// ==========================================================================================
// Manages an incremental build number stored in 'build.number'.
// Resets to 1 if 'mod_version' changes compared to the last build ('last.version').
// ==========================================================================================
def buildNumberFile = file('build.number')
def currentModVersion = project.mod_version
def buildNumber = 1

def versionFile = file('last.version')
if (versionFile.exists()) {
    def previousVersion = versionFile.text.trim()
    if (buildNumberFile.exists()) {
        if (previousVersion != currentModVersion) {
            // Reset build number if mod version has changed
            buildNumber = 1
        } else {
            // Increment build number if mod version is the same
            buildNumber = Integer.parseInt(buildNumberFile.text.trim()) + 1
        }
    }
}
buildNumberFile.text = buildNumber.toString()
versionFile.text = currentModVersion

// ==========================================================================================
// Version Configuration (SemVer Compliant)
// ==========================================================================================
// Format: MAJOR.MINOR.PATCH-minecraft_version+build.BUILDNUMBER
// Example: 0.15.0-alpha-1.21.11+build.42
// ==========================================================================================
version = "${project.mod_version}-${project.minecraft_version}+build.${buildNumber}"
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

// ==========================================================================================
// Repositories
// ==========================================================================================
repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me"       } // REI
    maven { url "https://maven.terraformersmc.com/" } // ModMenu
    maven { url "https://api.modrinth.com/maven"   } // Jade, MidnightLib
}

// ==========================================================================================
// Fabric Data Generation
// ==========================================================================================
fabricApi {
    configureDataGeneration() {
        client = true
    }
}

// ==========================================================================================
// Dependencies
// ==========================================================================================
dependencies {
    // Core Minecraft & Fabric
    minecraft          "com.mojang:minecraft:${project.minecraft_version}"
    implementation  "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API + Kotlin Language Adapter
    implementation  "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation  "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // Required Library
    implementation  "maven.modrinth:midnightlib:${project.midnightlib}+${project.minecraft_version}-fabric"

    // Optional Runtime Mods
    runtimeOnly     "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly     "maven.modrinth:jade:${project.jade}+fabric"

    // Optional REI Integration
    // compileOnly     "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei}"
    // runtimeOnly     "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei}"
}

// ==========================================================================================
// Resource Processing (version injection into fabric.mod.json)
// ==========================================================================================
processResources {
    outputs.upToDateWhen { false }
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ==========================================================================================
// Java / Kotlin Compilation
// ==========================================================================================
tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "25"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // withSourcesJar() // uncomment to include sources in JARs
}

// ==========================================================================================
// Task Dependencies (runDatagen runs before any execution / build)
// ==========================================================================================
tasks.named("runClient").configure { dependsOn(tasks.named("runDatagen")) }
tasks.named("runServer").configure { dependsOn(tasks.named("runDatagen")) }
tasks.named("build").configure     { dependsOn(tasks.named("runDatagen")) }

// ==========================================================================================
// Utility: Reset Build Number
// Usage: ./gradlew resetBuildNumber
// ==========================================================================================
tasks.register('resetBuildNumber') {
    group       = "Build Setup"
    description = "Resets the build number counter to 0 (next build will start at 1)."
    doLast {
        buildNumberFile.text = '0'
        println "Build number reset to 0. Next build will start from 1."
    }
}