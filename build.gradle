import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'fabric-loom' version '1.8-SNAPSHOT'
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.0.21"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/" }												//modmenu
	maven { url "https://gitlab.com/api/v4/projects/59105494/packages/maven" }						//crowdin
	maven { url "https://api.modrinth.com/maven" }													//modrinth jade(waila) midnight(config) emi

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	modRuntimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}")							//modmenu
	//include modRuntimeOnly("net.sssubtlety.sss_translate:mod:${project.crowdin}")					//crowdin
	modRuntimeOnly "maven.modrinth:jade:${project.jade}+fabric"										//jade (waila)
	//modRuntimeOnly "maven.modrinth:emi:${project.emi}+${project.minecraft_version}+fabric"			//emi (item viewer)
	modImplementation "maven.modrinth:midnightlib:${project.midnightlib}-fabric"					//midnight(config)
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release.set(21)
}

tasks.withType(KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = "21"
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}